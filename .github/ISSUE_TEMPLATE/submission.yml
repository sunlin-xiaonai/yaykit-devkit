name: 提交应用
description: 自测过的一版应用，交给 Yaykit 审核、真机测、签名上架
title: "提交：<slug> <版本>"
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        这张单是公开的。**不要贴**账号、手机号、邮箱、令牌、设备编号；日志用 `./kit logs` / `./kit info` 取（设备编号已经抹掉了），别的地方来的日志先自己抹掉。
        审核意见会回在这张单上；改完在这张单上回复新的提交号，不用另开。
  - type: input
    id: slug
    attributes: {label: 应用 slug, placeholder: my-timer}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: 版本号（和 app.json、PROJECT_VER 一样）, placeholder: 0.1.0}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: 这一版做了什么, description: 一两句话；第一次提交就说这个应用是做什么的}
    validations: {required: true}
  - type: input
    id: repo
    attributes: {label: 应用仓库地址, description: 仓库可以公开；私有的话，先把 vzheng56 加成协作者, placeholder: "https://github.com/<你>/my-timer"}
    validations: {required: true}
  - type: input
    id: commit
    attributes: {label: 提交号（完整 40 位）, description: 我们按这个提交重编；所有改动都要已经推上去}
    validations: {required: true}
  - type: input
    id: devkit
    attributes: {label: 开发包版本（./kit version 的 version）, placeholder: "1.0"}
    validations: {required: true}
  - type: input
    id: sha256
    attributes: {label: "./kit build --release 编出来的镜像 SHA-256", description: "./kit check 打出来的那一串（照抄，别自己算）"}
    validations: {required: true}
  - type: textarea
    id: kitcheck
    attributes: {label: ./kit check 的输出, description: 提交前先跑 ./kit check，要全过（最后一行是「✓ 都过了」）；整段贴进来, render: text}
    validations: {required: true}
  - type: textarea
    id: heap
    attributes: {label: 内存, description: 用到最重的那一刻以后 ./kit info 里 heap 那一段；internalMinSinceReady 不低于 40 KB（低于 60 KB 写原因）, render: text}
    validations: {required: true}
  - type: textarea
    id: shots
    attributes: {label: 截图, description: 主界面、提示、没网或出错时的样子、Yay 回来时念的结果；拖图片进来}
    validations: {required: true}
  - type: checkboxes
    id: checklist
    attributes:
      label: 兼容检查清单（docs/checklist.md）
      options:
        - label: 构建：release 编得过、不超过 3.5 MB、改动都已推上去、主机测试通过、devkit/ 没改过
          required: true
        - label: 生命周期：双击开应用环能回 Yay，从 Yay 能打开，离开前写了结果
          required: true
        - label: 规矩：不擦 NVS、只写自己的命名空间、不碰别人的资源、没有密钥和账号写进代码或日志
          required: true
        - label: 界面：主题色和字号、安全圆、提示箭头、人话提示、中英两套界面文字都放得下
          required: true
        - label: 内存和性能：内部 RAM 不低于 40 KB，半小时以上不重启不卡死
          required: true
  - type: textarea
    id: notes
    attributes: {label: 还想说的, description: 没做到的、想要的组件能力、要我们特别看的地方}

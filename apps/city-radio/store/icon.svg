<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 收音台 app icon: a small radio in the round-screen theme colours (yk_round.h). -->
  <!-- antenna -->
  <line x1="18" y1="21" x2="44" y2="7" stroke="#A5AA9E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="45" cy="6.5" r="3" fill="#A5AA9E"/>
  <!-- body -->
  <rect x="6" y="20" width="52" height="36" rx="9" fill="#DF795D"/>
  <!-- speaker -->
  <circle cx="22" cy="38" r="11" fill="#171C19"/>
  <circle cx="22" cy="38" r="7" fill="none" stroke="#9FB38C" stroke-width="2"/>
  <circle cx="22" cy="38" r="2.5" fill="#9FB38C"/>
  <!-- dial window with the needle -->
  <rect x="37" y="27" width="15" height="9" rx="2.5" fill="#F3E6C8"/>
  <line x1="44" y1="28.5" x2="44" y2="34.5" stroke="#DF795D" stroke-width="2" stroke-linecap="round"/>
  <!-- knobs -->
  <circle cx="40.5" cy="45" r="3.5" fill="#FAF7EF"/>
  <circle cx="49.5" cy="45" r="3.5" fill="#FAF7EF"/>
</svg>
